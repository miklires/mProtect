name: Modrinth metadata

on:
  workflow_dispatch:
    inputs:
      submit-review:
        description: Submit the project for Modrinth review
        required: true
        type: boolean
        default: false
      version-id:
        description: Modrinth version ID to normalize; newest when empty
        required: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update project metadata
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          SUBMIT_REVIEW: ${{ inputs.submit-review }}
        run: |
          jq -n --rawfile body README.md --argjson submit "$SUBMIT_REVIEW" '{
            title: "mProtect",
            description: "Configurable exploit checks and server hardening for Paper, Purpur, and Folia.",
            body: $body,
            categories: ["management", "optimization", "utility"],
            additional_categories: [],
            source_url: "https://github.com/miklires/mProtect",
            issues_url: "https://github.com/miklires/mProtect/issues",
            wiki_url: "https://miklires.su/wiki/mprotect",
            discord_url: "https://discord.gg/pes25cnWKy",
            donation_urls: [{id: "other", platform: "Other", url: "https://miklires.su/support"}],
            license_id: "MIT"
          } + (if $submit then {requested_status: "approved"} else {} end)' > modrinth-project.json
          curl --fail-with-body --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @modrinth-project.json \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID"
      - name: Update telemetry disclosure
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          jq -n '{set: [{type: "telemetry", consent: "opt_out", data_collected: ["https://bstats.org/docs/server-owners"]}], remove: []}' \
            | curl --fail-with-body --request PATCH \
              --header "Authorization: $MODRINTH_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @- \
              "https://api.modrinth.com/v3/project/$MODRINTH_PROJECT_ID/disclosures"
      - name: Normalize newest version metadata
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          VERSION_ID: ${{ inputs.version-id }}
        run: |
          if [ -z "$VERSION_ID" ]; then
            VERSION_ID=$(curl --fail-with-body --silent \
              --header "Authorization: $MODRINTH_TOKEN" \
              "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/version" | jq -r '.[0].id // empty')
          fi
          if [ -z "$VERSION_ID" ]; then
            echo "No version exists yet; project metadata is ready."
            exit 0
          fi
          jq -n '{
            name: "mProtect 1.0.0",
            version_number: "1.0.0",
            version_type: "release",
            featured: true,
            game_versions: ["26.2"],
            loaders: ["paper", "purpur", "folia"]
          }' | curl --fail-with-body --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "https://api.modrinth.com/v2/version/$VERSION_ID"
      - name: Verify metadata
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          curl --fail-with-body --silent \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID" \
            | jq '{id, slug, status, requested_status, icon_url, categories, source_url, issues_url, wiki_url, discord_url, donation_urls}'
          curl --fail-with-body --silent \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v3/project/$MODRINTH_PROJECT_ID/disclosures" \
            | jq '.disclosures | map({type, consent, data_collected})'
          curl --fail-with-body --silent \
            --header "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/version" \
            | jq 'map({id, name, version_number, status, game_versions, loaders, featured, files: [.files[].filename]})'
