prefix: "<gradient:#7CB342:#558B2F><bold>mProtect</bold></gradient> <dark_gray>»</dark_gray> "
no-permission: "<red>You do not have permission to do that."
usage: "<yellow>Usage: <white>/mprotect <status|violations|test|reload>"
reloaded: "<green>Safe configuration values and messages were reloaded. Storage settings require a restart."
blocked: "<red>mProtect blocked an unsafe action."
command-blocked: "<red>That command is not available."
command-rate: "<red>You are sending commands too quickly."
status-header: "<green>mProtect <white>{version}"
status-line: "<gray>{check}: <white>{state} <dark_gray>— <white>{count} today"
status-total: "<gray>Violations today: <white>{count}"
violations-empty: "<gray>No matching violations were found."
violations-header: "<green>Recent violations <gray>({filter})"
violations-line: "<dark_gray>{time} <white>{player} <gray>{check}: {detail}"
test-ok: "<green>{check} is enabled and its configuration is valid."
test-disabled: "<yellow>{check} is disabled."
test-unknown: "<red>Unknown check. Use items, books, signs, anvils, commands, creative, entities, or chunks."
alert: "<red>[mProtect]</red> <white>{player}</white> <gray>triggered</gray> <yellow>{check}</yellow><gray>: {detail} <dark_gray>(x{count})"
kick: "<red>Disconnected by mProtect: {check}."
