prefix: "<gradient:#7CB342:#558B2F><bold>mProtect</bold></gradient> <dark_gray>»</dark_gray> "
no-permission: "<red>У вас нет прав на это действие."
usage: "<yellow>Использование: <white>/mprotect <status|violations|test|inspect|scan|reload>"
