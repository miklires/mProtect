reloaded: "<green>Безопасные настройки и сообщения перезагружены. Настройки хранилища требуют перезапуска."
blocked: "<red>mProtect заблокировал небезопасное действие."
command-blocked: "<red>Эта команда недоступна."
command-rate: "<red>Вы отправляете команды слишком быстро."
status-header: "<green>mProtect <white>{version}"
status-line: "<gray>{check}: <white>{state} <dark_gray>— <white>{count} сегодня"
status-total: "<gray>Нарушений сегодня: <white>{count}"
violations-empty: "<gray>Подходящие нарушения не найдены."
invalid-player: "<red>Укажите корректное имя игрока Minecraft."
violations-header: "<green>Последние нарушения <gray>({filter})"
