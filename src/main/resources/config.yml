config-version: 3

language:
  default: en_US

metrics:
  enabled: true
  bstats-id: 33359

updates:
  enabled: true
  modrinth-project-id: "mprotect"

alerts:
  staff-chat: true
  permission: mprotect.alerts
  deduplication-seconds: 3
  max-pending-buckets: 2048
  file-log: true
  discord:
    enabled: false
    webhook-url: ""

storage:
  file: violations
  retention-days: 30

# Actions: REMOVE, REPLACE, LOG, KICK.
items:
  enabled: true
  action: REMOVE
  replacement: AIR
  reject-overstacked: true
  # Keep false when another trusted plugin intentionally creates unbreakable rewards.
  reject-unbreakable: false
  fallback-scan-minutes: 5
  blocked-materials:
    - BEDROCK
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - BARRIER
    - STRUCTURE_VOID
    - STRUCTURE_BLOCK
    - JIGSAW
    - LIGHT
    - END_PORTAL_FRAME
    - SPAWNER
    - DEBUG_STICK
    - KNOWLEDGE_BOOK
  enchantments:
    enabled: true
    reject-incompatible: true
  attributes:
    enabled: true
    max-absolute-amount: 2048.0
    reject-duplicate-uuids: true
  components:
    enabled: true
    max-serialized-bytes: 65536
    max-container-depth: 2
    max-container-items: 1728
  text:
    max-name-characters: 128
    max-lore-lines: 64
    max-lore-line-characters: 512
    max-lore-total-characters: 4096
  potions:
    max-amplifier: 4
    max-duration-ticks: 72000
  fireworks:
    max-power: 3
    max-effects: 8

books:
  enabled: true
  action: REMOVE
  max-pages: 50
  max-page-characters: 1024
  max-total-characters: 20000
  max-title-characters: 32
  max-author-characters: 16
  max-component-json-characters: 32768
  strip-formatting: false

signs:
  enabled: true
  max-line-characters: 384
  max-total-characters: 1024
  strip-click-events: true

anvils:
  enabled: true
  max-name-characters: 64
  max-repair-cost: 1000
  strip-formatting: true

commands:
  enabled: true
  max-length: 512
  rate-limit:
    commands: 12
    window-seconds: 3
  blocked:
    - plugins
    - pl
    - version
    - ver
    - about
    - reload
    - rl
    - op
    - deop
    - stop
    - restart
  blocked-namespaces:
    - bukkit
    - paper
    - purpur
    - spigot
  blocked-roots:
    - execute

creative:
  enabled: true
  allowed-permission: mprotect.bypass.creative
  return-to-survival-on-join: true

entities:
  enabled: true
  max-per-chunk: 120
  max-per-type-per-chunk: 40
  cancel-excess-spawns: true
  spawn-rate:
    events: 80
    window-seconds: 2
  per-type-limits:
    ITEM: 40
    EXPERIENCE_ORB: 32
    ARMOR_STAND: 24
    ITEM_FRAME: 32
    GLOW_ITEM_FRAME: 32
    FALLING_BLOCK: 24
    MINECART: 16
    CHEST_MINECART: 16
    HOPPER_MINECART: 12
    TNT_MINECART: 8
    TNT: 24

chunk-loads:
  enabled: true
  max-new-chunks: 24
  window-seconds: 5

# Lag-machine protection uses bounded per-chunk or per-player windows. Raise
# limits for technical servers; disabling one section does not affect others.
redstone:
  enabled: true
  events: 800
  window-seconds: 1

automation:
  enabled: true
  pistons:
    events: 80
    window-seconds: 1
    max-blocks-per-move: 12
  hoppers:
    events: 300
    window-seconds: 1
  dispensers:
    events: 120
    window-seconds: 1

physics:
  enabled: true
  block-updates:
    events: 1200
    window-seconds: 1
  fluids:
    events: 500
    window-seconds: 1
  spread:
    events: 300
    window-seconds: 1
  max-multi-block-changes: 512

explosions:
  enabled: true
  events: 12
  window-seconds: 2
  max-affected-blocks: 256
  max-yield: 0.3
  tnt-prime:
    events: 24
    window-seconds: 2

spawners:
  enabled: true
  per-block:
    events: 8
    window-seconds: 10
  per-chunk:
    events: 32
    window-seconds: 10

portals:
  enabled: true
  create:
    events: 4
    window-seconds: 10
  max-created-blocks: 128
  max-search-radius: 32
  max-creation-radius: 16
  player-use:
    events: 8
    window-seconds: 10

activity:
  enabled: true
  inventory-clicks:
    events: 80
    window-seconds: 2
  interactions:
    events: 100
    window-seconds: 2
  block-changes:
    events: 80
    window-seconds: 2
  item-drops:
    events: 40
    window-seconds: 2
  projectiles:
    events: 30
    window-seconds: 2
