config-version: 1

language:
  default: en_US

metrics:
  enabled: true
  bstats-id: 33359

updates:
  enabled: true
  modrinth-project-id: ""

alerts:
  staff-chat: true
  permission: mprotect.alerts
  deduplication-seconds: 3
  file-log: true
  discord:
    enabled: false
    webhook-url: ""

storage:
  file: violations
  retention-days: 30

# Actions: REMOVE, REPLACE, LOG, KICK.
items:
  enabled: true
  action: REMOVE
  replacement: AIR
  reject-overstacked: true
  fallback-scan-minutes: 5
  blocked-materials:
    - BEDROCK
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - BARRIER
    - STRUCTURE_VOID
    - STRUCTURE_BLOCK
    - JIGSAW
    - LIGHT
    - END_PORTAL_FRAME
    - SPAWNER
    - DEBUG_STICK
    - KNOWLEDGE_BOOK
  enchantments:
    enabled: true
    reject-incompatible: true
  attributes:
    enabled: true
    max-absolute-amount: 2048.0
    reject-duplicate-uuids: true
  components:
    enabled: true
    max-serialized-bytes: 65536
    max-container-depth: 2
    max-container-items: 1728

books:
  enabled: true
  action: REMOVE
  max-pages: 50
  max-page-characters: 1024
  max-total-characters: 20000
  max-title-characters: 32
  max-component-json-characters: 32768
  strip-formatting: false

signs:
  enabled: true
  max-line-characters: 384
  max-total-characters: 1024
  strip-click-events: true

anvils:
  enabled: true
  max-name-characters: 64
  max-repair-cost: 1000
  strip-formatting: true

commands:
  enabled: true
  max-length: 512
  rate-limit:
    commands: 12
    window-seconds: 3
  blocked:
    - plugins
    - pl
    - version
    - ver
    - about
    - reload
    - rl
    - op
    - deop
    - stop
    - restart
  blocked-namespaces:
    - minecraft
    - bukkit
    - paper
    - purpur
    - spigot
  blocked-roots:
    - execute

creative:
  enabled: true
  allowed-permission: mprotect.bypass.creative
  return-to-survival-on-join: true

entities:
  enabled: true
  max-per-chunk: 120
  max-per-type-per-chunk: 40
  cancel-excess-spawns: true

chunk-loads:
  enabled: true
  max-new-chunks: 24
  window-seconds: 5
